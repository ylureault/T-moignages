<div class="page-header">
  <div class="page-title">
    <h1>Envoyer un email</h1>
  </div>
</div>

<div class="send-container">
  <div class="send-form-section">
    <form id="sendForm">
      <div class="form-group">
        <label for="sendCampaign">Campagne <span class="required">*</span></label>
        <select id="sendCampaign" name="campaign_id" required onchange="updateVariables()">
          {{campaigns_options}}
        </select>
      </div>

      <div class="form-group">
        <label for="sendTemplate">Template <span class="required">*</span></label>
        <select id="sendTemplate" name="template_id" required onchange="updatePreview()">
          {{templates_options}}
        </select>
      </div>

      <div class="form-group">
        <label for="sendEmails">Email(s) destinataire(s) <span class="required">*</span></label>
        <input type="text" id="sendEmails" name="emails" required placeholder="email1@exemple.com, email2@exemple.com">
        <span class="form-hint">Séparez les emails par des virgules</span>
      </div>

      <div class="form-group">
        <label for="sendPrenom">Prénom destinataire <span class="optional">(optionnel)</span></label>
        <input type="text" id="sendPrenom" name="prenom" placeholder="Ex: Jean" onchange="updatePreview()">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="copyHtml()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copier HTML
        </button>
        <button type="submit" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          Envoyer via Brevo
        </button>
      </div>
    </form>

    <!-- Variables preview -->
    <div class="variables-preview">
      <h3>Variables de la campagne</h3>
      <div class="variables-grid" id="variablesGrid">
        <div class="variable-item">
          <span class="variable-label">Type</span>
          <span class="variable-value" id="varType">-</span>
        </div>
        <div class="variable-item">
          <span class="variable-label">Entreprise</span>
          <span class="variable-value" id="varCompany">-</span>
        </div>
        <div class="variable-item">
          <span class="variable-label">Facilitateurs</span>
          <span class="variable-value" id="varFacilitators">-</span>
        </div>
        <div class="variable-item">
          <span class="variable-label">Date</span>
          <span class="variable-value" id="varDate">-</span>
        </div>
        <div class="variable-item variable-item-full">
          <span class="variable-label">Lien</span>
          <span class="variable-value" id="varLink">-</span>
        </div>
      </div>
    </div>
  </div>

  <div class="send-preview-section">
    <h3>Prévisualisation</h3>
    <div class="preview-subject" id="previewSubject">Sélectionnez un template</div>
    <div class="preview-container">
      <iframe id="previewFrame" style="width:100%;height:100%;border:none;"></iframe>
    </div>
  </div>
</div>

<!-- Result Modal -->
<div id="resultModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Résultat de l'envoi</h2>
      <button class="modal-close" onclick="closeResultModal()">&times;</button>
    </div>
    <div class="modal-body" id="resultContent">
      <!-- Results loaded dynamically -->
    </div>
  </div>
</div>
