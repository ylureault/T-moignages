<div class="page-header">
  <div class="page-title">
    <h1>Types d'accompagnement</h1>
    <span class="badge badge-count">{{types_count}} type(s)</span>
  </div>
  <button class="btn btn-primary" onclick="openCreateTypeModal()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Nouveau type
  </button>
</div>

<!-- Types list -->
<div class="types-list">
  {{types}}
</div>

<!-- Create/Edit Type Modal -->
<div id="typeModal" class="modal">
  <div class="modal-content modal-small">
    <div class="modal-header">
      <h2 id="typeModalTitle">Nouveau type</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="typeForm">
        <input type="hidden" id="typeId" name="id">

        <div class="form-group">
          <label for="typeName">Nom du type <span class="required">*</span></label>
          <input type="text" id="typeName" name="name" required placeholder="Ex: Séminaire d'équipe">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
